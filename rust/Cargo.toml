[package]
name = "rust_lib_r16a_chat_client"
version = "0.1.0"
edition = "2024"

[dependencies]
flutter_rust_bridge = "=2.12.0"
matrix-sdk = "0.18.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mime = "0.3"
serde_json = "1.0.150"
tokio = { version = "1", features = ["sync", "time"] }

[lib]
crate-type = ["cdylib", "staticlib"]

# Avatar re-encoding (decode + resize) takes ~10s unoptimized, which is what
# `flutter run` builds. Optimize just the image crates in dev builds.
[profile.dev.package]
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
flate2 = { opt-level = 3 }
image-webp = { opt-level = 3 }
gif = { opt-level = 3 }
weezl = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
moxcms = { opt-level = 3 }
